<svg viewBox="0 0 1200 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="section divider">
  <style>
    svg { --ink:#191A1F; --accent:#CF3F17; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#F3F3F1; --accent:#EF6039; }
    }
    .line { stroke: var(--ink); stroke-opacity: 0.14; stroke-width: 1; }
    .diamond { fill: var(--accent); }
  </style>
  <line class="line" x1="0" y1="16" x2="560" y2="16"/>
  <line class="line" x1="640" y1="16" x2="1200" y2="16"/>
  <rect class="diamond" x="596" y="12" width="8" height="8" transform="rotate(45 600 16)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
